<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Squircle Base -->
  <rect width="48" height="48" rx="12" fill="#0F172A"/>
  
  <!-- Subtle Inner Radial Highlight -->
  <circle cx="24" cy="16" r="18" fill="url(#brand_highlight)" opacity="0.15"/>

  <!-- Orbital Scheduler Arc (Open Cycle) -->
  <path d="M 24 10 A 14 14 0 1 1 11.5 29" stroke="url(#arc_gradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Clock / Cadence Ticks (Schedule Nodes) -->
  <line x1="24" y1="10" x2="24" y2="15" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="33" y2="24" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center Hub Node -->
  <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>

  <!-- Multi-Channel Distribution Rays -->
  <path d="M 24 24 L 32 18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 24 24 L 30 32" stroke="#818CF8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Target Platform Signals (The 3 Social Endpoints) -->
  <circle cx="32" cy="18" r="2" fill="#38BDF8"/>
  <circle cx="30" cy="32" r="2" fill="#818CF8"/>
  <circle cx="15.5" cy="16" r="2" fill="#60A5FA"/>

  <defs>
    <radialGradient id="brand_highlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(24 16) rotate(90) scale(18)">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc_gradient" x1="10" y1="10" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
</svg>
